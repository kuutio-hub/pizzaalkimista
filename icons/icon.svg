  <circle cx="180" cy="310" r="15" fill="#B33B1E"/>
  <path d="M250 250c10-22 34-30 50-18-4 20-26 36-50 18z" fill="#4A7856"/>
  <path d="M262 262c-16 6-34-4-38-24 18-10 40-2 46 14z" fill="#5C8F68"/>
